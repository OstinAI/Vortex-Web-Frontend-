<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VORTEX CORE - CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crm.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="vortex-runtime">

    <div class="vortex-background">
        <video autoplay muted loop playsinline id="vortex-video-bg">
            <source src="../static/video/background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="vortex-overlay"></div>
    </div>

    <header class="vortex-top-bar">
        <div class="vortex-info-grid">

            <div class="vortex-controls-group">
                <div style="display: flex; gap: 12px;">

                    <div class="vortex-status-node" onclick="window.location.href='/dashboard'" style="cursor: pointer; width: 32px; min-width: 32px; justify-content: center; padding: 0;">
                        <span style="color: var(--vortex-accent); font-weight: bold; font-size: 14px;">❮</span>
                    </div>

                    <div class="vortex-status-node primary-node" onclick="openCreatePipelineModal()">
                        <span id="current-pipeline-btn-text">+ ВОРОНКА</span>
                    </div>

                    <div class="vortex-status-node action-node" onclick="openCreateDealModal()">
                        <span>+ СДЕЛКА</span>
                    </div>
                </div>

                <div class="vortex-view-selector" style="display: flex; gap: 20px; margin-top: 10px;">
                    <button onclick="switchView('kanban')" class="view-btn active" id="btn-kanban">КАНБАН</button>
                    <button onclick="switchView('list')" class="view-btn" id="btn-list">СПИСОК</button>
                </div>
            </div>

            <div class="vortex-indicators-group">
                <div class="vortex-status-node">
                    <div id="vortex-time-display" style="font-weight: 700;">--:--:--</div>
                    <div id="vortex-date-display" style="font-size: 11px; opacity: 0.6;">--.--</div>
                </div>

                <div class="vortex-status-node" id="node-task-link" style="cursor: pointer; transition: opacity 0.2s;">
                    <div style="font-size: 11px; opacity: 0.6;">ЗАДАЧА</div>
                    <div id="txt-manager-task" style="color: var(--vortex-accent); font-weight: 700;">НЕТ ПЛАНОВ</div>
                </div>

                <div class="vortex-status-node">
                    <div id="manager-month-name" style="font-size: 11px; opacity: 0.6;">МЕСЯЦ</div>
                    <div id="txt-manager-total-pay" style="color: var(--vortex-accent); font-weight: 700;">0 ₸</div>
                </div>

                <div class="vortex-status-node" style="flex-direction: row; gap: 10px; border-left: 1px solid rgba(0, 229, 255, 0.2); padding-left: 15px;">
                    <div id="user-initial-circle" style="width: 24px; height: 24px; background: var(--vortex-accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);">..</div>
                    <div id="user-display-name" style="color: var(--vortex-accent); font-size: 11px; font-weight: 800; letter-spacing: 0.5px;">ЗАГРУЗКА...</div>
                </div>
            </div>

        </div>
    </header>

    <div class="vortex-view-selector" style="padding: 10px 40px; display: flex; gap: 20px; border-bottom: 1px solid var(--vortex-border);">
        <button onclick="switchView('kanban')" class="view-btn active" id="btn-kanban">КАНБАН</button>
        <button onclick="switchView('list')" class="view-btn" id="btn-list">СПИСОК</button>
    </div>

    <main class="vortex-crm-board">

        <div id="crm-canvas" class="vortex-canvas"></div>

        <div id="crm-list-view" class="vortex-list-container" style="display: none;">
            <table class="vortex-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Воронка</th>
                        <th>Этап</th>
                        <th>Ответственный</th>
                        <th style="text-align:right">Сумма</th>
                    </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </main>

    <template id="stage-template">
        <div class="vortex-stage-column">
            <div class="stage-header">

                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                    <button class="stage-btn del-btn" title="Удалить этап">−</button>
                    <input type="text" class="stage-input" placeholder="Название этапа...">
                    <button class="stage-btn add-btn" title="Добавить этап">+</button>
                </div>

                <div class="stage-neon-line">
                    <input type="color" class="stage-color-picker" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                </div>

            </div>
            <div class="stage-body">
                <div class="empty-deals-plug">НЕТ СДЕЛОК</div>
            </div>
        </div>
    </template>

    <div id="pipeline-modal" class="vortex-modal" style="display:none;">
        <div class="modal-content">
            <h3 style="color: var(--vortex-accent); text-transform: uppercase; margin-bottom: 25px;">
                УПРАВЛЕНИЕ ВОРОНКАМИ
            </h3>

            <div class="vortex-field-group">
                <label class="vortex-label">НАЗВАНИЕ НОВОЙ ВОРОНКИ</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="pipeline-new-name" class="vortex-input" placeholder="Например: Продажи B2B...">
                    <button onclick="saveNewPipeline()" class="vortex-btn-primary" style="padding: 0 15px; min-width: 45px;">+</button>
                </div>
            </div>

            <div class="vortex-field-group" style="margin-top: 30px;">
                <label class="vortex-label">ВАШИ ВОРОНКИ (ДВОЙНОЙ КЛИК ДЛЯ ВЫБОРА)</label>
                <div id="pipeline-manage-list" style="max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--vortex-border);">
                </div>
            </div>

            <div style="margin-top: 30px;">
                <button onclick="closePipelineModal()" class="vortex-btn-danger" style="width: 100%;">ЗАКРЫТЬ</button>
            </div>
        </div>
    </div>

    <div id="deal-modal" class="vortex-modal" style="display:none;">
        <div class="modal-content">
            <h3 style="color: var(--vortex-accent); text-transform: uppercase; margin-bottom: 25px;">
                НОВАЯ СДЕЛКА
            </h3>

            <div class="vortex-field-group">
                <label class="vortex-label">ИМЯ КЛИЕНТА</label>
                <input type="text" id="deal-client-name" class="vortex-input" placeholder="Введите ФИО...">
            </div>

            <div class="vortex-field-group">
                <label class="vortex-label">ВОРОНКА</label>
                <select id="deal-pipeline-select" class="vortex-input" onchange="updateModalStages()" required>
                    <option value="">-- Выберите воронку --</option>
                </select>
            </div>

            <div class="vortex-field-group">
                <label class="vortex-label">ЭТАП</label>
                <select id="deal-stage-select" class="vortex-input" required>
                    <option value="">-- Выберите этап --</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button onclick="createOfflineDeal()" class="vortex-btn-primary" style="flex: 1;">СОЗДАТЬ</button>
                <button onclick="closeModal()" class="vortex-btn-danger" style="flex: 1;">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <div id="client-card-overlay" class="vortex-modal-overlay" style="display: none;">
        <div class="vortex-card-container">
            <header class="vortex-card-header">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <button onclick="closeClientCard()" class="vortex-btn-danger" style="width: 42px; height: 42px; padding: 0;">✕</button>
                    <h1 id="card-client-name">ЗАГРУЗКА...</h1>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="vortex-btn-primary">СОХРАНИТЬ</button>
                </div>
            </header>

            <div class="vortex-card-content">
                <aside class="vortex-card-sidebar">
                    <div class="vortex-card-section">
                        <label class="vortex-label">ОСНОВНЫЕ ДАННЫЕ</label>
                        <div id="card-custom-fields" class="fields-list">
                        </div>
                    </div>

                    <div class="vortex-card-section">
                        <label class="vortex-label">ТОВАРЫ И ОПЛАТА</label>
                        <div class="vortex-mini-list" id="card-sale-lines"></div>
                        <div class="vortex-card-total">
                            ИТОГО: <span id="card-total-sum" style="color: var(--vortex-accent);">0</span> ₸
                        </div>
                    </div>

                    <div class="vortex-card-section">
                        <label class="vortex-label">ОТВЕТСТВЕННЫЙ</label>
                        <div id="card-responsible" class="vortex-status-node" style="width: 100%; justify-content: start;">
                            Не назначен
                        </div>
                    </div>
                </aside>

                <main class="vortex-card-workarea">
                    <nav class="vortex-card-tabs">
                        <button class="view-btn active">ЧАТ</button>
                        <button class="view-btn">ЗАДАЧИ</button>
                        <button class="view-btn">ЗАМЕТКИ</button>
                    </nav>

                    <div id="card-timeline" class="vortex-timeline">
                    </div>
                </main>
            </div>
        </div>
    </div>


    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/crm.js') }}"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../static/js/cart/CardUserExtension.js"></script>

    <script>
        function togglePipelinePopup() {
            const p = document.getElementById('pipeline-popup');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        function closeModal() { document.getElementById('deal-modal').style.display = 'none'; }
    </script>
</body>
</html>
