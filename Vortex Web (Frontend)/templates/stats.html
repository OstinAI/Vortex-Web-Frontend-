<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Stats | Аналитика</title>
    <link rel="stylesheet" href="static/css/stats.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="vortex-top-bar">
        <div class="vortex-header-controls">
            <button class="btn-vortex-back" onclick="window.history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span style="letter-spacing: 3px; font-size: 14px;">АНАЛИТИКА СИСТЕМЫ</span>
        </div>
    </header>

    <main class="vortex-layout-grid">
        <section class="tasks-scroll-area" style="width: 100%;">

            <div class="zone-left">
                <h2 class="vortex-title">ОБЩАЯ СТАТИСТИКА</h2>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px;">

               

            </div>

        </section>
    </main>

    <script src="stats.js"></script>
</body>
</html>
