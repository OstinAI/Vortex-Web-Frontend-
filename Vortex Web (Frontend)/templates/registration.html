<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VORTEX - Регистрация компании</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-image"></div>
    <div class="navbar">
        <div class="nav-logo">VORTEX</div>
        <div class="nav-links"><a href="/" class="nav-link">На главную</a></div>
    </div>

    <div class="auth-container" style="display: block; width: 550px; top: 50%;">
        <div class="auth-card">
            <h1 class="vortex-title" style="font-size: 32px;">РЕГИСТРАЦИЯ</h1>
            <p class="vortex-sub">новой компании</p>

            <div class="error-message" id="reg-error-box" style="display: none; color: #FFFF6B6B; margin-bottom: 10px;"></div>

            <div class="input-field"><input type="text" id="tbCompany" required placeholder=" "><label>Название компании</label></div>
            <div class="input-field"><input type="text" id="tbSlogan" placeholder=" "><label>Слоган</label></div>
            <div class="input-field"><input type="text" id="tbBin" required placeholder=" "><label>БИН / ИИН</label></div>
            <div class="input-field"><input type="text" id="tbPhone" required placeholder=" "><label>Телефон</label></div>
            <div class="input-field"><input type="text" id="tbWebsite" placeholder=" "><label>Веб-сайт</label></div>
            <div class="input-field"><input type="text" id="tbAddress" placeholder=" "><label>Адрес</label></div>
            <div class="input-field"><input type="text" id="tbLogin" required placeholder=" "><label>Логин администратора</label></div>
            <div class="input-field"><input type="password" id="pbPassword" required placeholder=" "><label>Пароль</label></div>
            <div class="input-field"><input type="password" id="pbPassword2" required placeholder=" "><label>Повторите пароль</label></div>

            <button type="button" id="btnRegister" class="login-btn" onclick="handleRegistration()">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/registration.js') }}"></script>
</body>
</html>
