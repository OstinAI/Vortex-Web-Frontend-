<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX - Technologies</title>

    <link rel="icon" type="image/png" href="/static/images/logo.png">

    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- ЕДИНАЯ ШАПКА -->
    <link rel="stylesheet" href="/home/style/cap/header.css">

    <!-- ОБЩИЙ CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        /* ВИДЕОФОН */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

            .video-background video {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                min-width: 100%;
                min-height: 100%;
                width: auto;
                height: auto;
                object-fit: cover;
            }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .feature-label {
            position: absolute;
            color: white;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            white-space: nowrap;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            transition: opacity 0.3s, border-color 0.3s, background-color 0.3s;
        }

            .feature-label:hover {
                border-color: #00ffff;
                background-color: rgba(0, 0, 0, 0.9);
            }

        @media (max-width: 600px) {
            #spiralCanvas, #galaxy-overlay {
                display: none !important;
            }

            .video-background {
                display: block !important;
            }

            .video-overlay {
                display: block !important;
            }
        }

        /* ===== COOKIE БАННЕР ===== */
        .cookie-banner {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            width: 90%;
            max-width: 700px;
            background: rgba(10, 10, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(0, 212, 255, 0.12);
            padding: 20px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 212, 255, 0.03);
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: all 0.4s ease;
        }

            .cookie-banner.show {
                display: flex;
            }

            .cookie-banner .cookie-text {
                color: rgba(255, 255, 255, 0.8);
                font-size: 13px;
                line-height: 1.6;
                flex: 1;
            }

                .cookie-banner .cookie-text a {
                    color: #00E5FF;
                    text-decoration: none;
                    font-weight: 500;
                    transition: color 0.3s ease;
                }

                    .cookie-banner .cookie-text a:hover {
                        color: #66f0ff;
                        text-decoration: underline;
                    }

            .cookie-banner .cookie-buttons {
                display: flex;
                gap: 10px;
                flex-shrink: 0;
            }

            .cookie-banner .cookie-btn {
                padding: 8px 24px;
                border-radius: 10px;
                border: none;
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                white-space: nowrap;
            }

                .cookie-banner .cookie-btn.accept {
                    background: linear-gradient(135deg, #00d4ff, #7b2ffc);
                    color: #fff;
                }

                    .cookie-banner .cookie-btn.accept:hover {
                        transform: translateY(-2px);
                        box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3);
                    }

                .cookie-banner .cookie-btn.decline {
                    background: rgba(255, 255, 255, 0.06);
                    color: rgba(255, 255, 255, 0.6);
                    border: 1px solid rgba(255, 255, 255, 0.08);
                }

                    .cookie-banner .cookie-btn.decline:hover {
                        background: rgba(255, 255, 255, 0.1);
                        color: #fff;
                    }

        @media (max-width: 600px) {
            .cookie-banner {
                flex-direction: column;
                align-items: stretch;
                bottom: 70px;
                padding: 18px 20px;
                width: 92%;
                border-radius: 14px;
            }

                .cookie-banner .cookie-text {
                    font-size: 12px;
                    text-align: center;
                }

                .cookie-banner .cookie-buttons {
                    justify-content: center;
                }

                .cookie-banner .cookie-btn {
                    padding: 8px 18px;
                    font-size: 12px;
                }
        }

        @media (max-width: 400px) {
            .cookie-banner .cookie-buttons {
                flex-direction: column;
                gap: 8px;
            }

            .cookie-banner .cookie-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>

</head>
<body>

    <!-- ВИДЕОФОН -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="/styles/background/video/background.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>
    <div class="video-overlay"></div>

    <!-- COOKIE БАННЕР -->
    <div class="cookie-banner" id="cookieBanner">
        <div class="cookie-text">
            <i class="fas fa-cookie-bite" style="color: #00E5FF; margin-right: 8px;"></i>
            Мы используем <strong>cookies</strong> для улучшения работы сайта.
            Продолжая использовать сайт, вы соглашаетесь с
            <a href="/privacy-policy">политикой конфиденциальности</a>.
        </div>
        <div class="cookie-buttons">
            <button class="cookie-btn decline" onclick="declineCookies()">Отказаться</button>
            <button class="cookie-btn accept" onclick="acceptCookies()">Принять</button>
        </div>
    </div>

    <canvas id="spiralCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;"></canvas>

    <div id="galaxy-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; font-family: 'Segoe UI', Roboto, sans-serif;">
        <!-- Здесь были feature-label плашки -->
    </div>

    <!-- ШАПКА -->
    <div class="navbar">
        <a href="/" class="nav-logo">VORTEX CORE</a>
        <div class="burger-menu" id="burgerToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links">
            <a href="/#auth" class="nav-link" id="login-nav">Вход</a>
        </div>
    </div>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <div class="side-panel" id="sidePanel">
        <nav class="side-nav">
            <a href="/about" class="side-link">О нас</a>
            <a href="/tariffs" class="side-link">Тарифы</a>
            <a href="/contacts" class="side-link">Контакты</a>
            <a href="/questions" class="side-link">Вопросы</a>
            <a href="/support" class="side-link">Поддержка</a>
            <a href="/distributor" class="side-link">Дистрибьютор</a>
        </nav>
    </div>

    <!-- ФОРМА АВТОРИЗАЦИИ -->
    <div id="auth-form" class="auth-container">
        <div class="auth-card">
            <div class="logo-wrapper">
                <img src="/static/images/123.gif" class="bee-gif" alt="Vortex Logo">
            </div>
            <h1 class="vortex-title">VORTEX</h1>
            <p class="vortex-sub">technologies</p>
            <div class="error-message" id="error-box"></div>

            <div class="input-field">
                <input type="text" id="company" required placeholder=" " spellcheck="false" autocomplete="organization">
                <label>Компания</label>
            </div>

            <div class="input-field">
                <input type="text" id="username" required placeholder=" " spellcheck="false" autocomplete="username">
                <label>Логин</label>
            </div>

            <div class="input-field">
                <input type="password" id="password" required placeholder=" " spellcheck="false" autocomplete="current-password">
                <label>Пароль</label>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Запомнить логин</label>
            </div>

            <button class="login-btn" onclick="handleLogin()">ВХОД</button>

            <div class="auth-footer">
                <a href="/registration" class="reg-link">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <!-- ФУТЕР С ИНФОРМАЦИЕЙ О РАЗРАБОТКЕ -->
    <div style="
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        color: rgba(255, 255, 255, 0.4);
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 300;
        letter-spacing: 0.5px;
        text-align: center;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        background: rgba(0, 0, 0, 0.25);
        padding: 6px 20px;
        border-radius: 20px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
    ">
        <span>© 2025 <span style="color: rgba(0, 212, 255, 0.7); font-weight: 500;">Vortex</span> Technologies Inc.</span>
        <span style="margin: 0 8px; opacity: 0.3;">|</span>
        <span>Все права защищены</span>
    </div>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/home/home/home.js"></script>
    <script src="/home/style/menu/menu.js"></script>

    <!-- COOKIE СКРИПТ -->
    <script>
        // Проверяем, было ли уже дано согласие
        function checkCookieConsent() {
            const consent = localStorage.getItem('cookieConsent');
            if (consent === null) {
                // Показываем баннер, если согласия нет
                document.getElementById('cookieBanner').classList.add('show');
            }
        }

        // Принять cookies
        function acceptCookies() {
            localStorage.setItem('cookieConsent', 'accepted');
            document.getElementById('cookieBanner').classList.remove('show');
            // Здесь можно добавить загрузку аналитических скриптов
            console.log('Cookies приняты');
        }

        // Отказаться от cookies
        function declineCookies() {
            localStorage.setItem('cookieConsent', 'declined');
            document.getElementById('cookieBanner').classList.remove('show');
            // Здесь можно отключить аналитические скрипты
            console.log('Отказ от cookies');
        }

        // Показываем баннер при загрузке
        document.addEventListener('DOMContentLoaded', checkCookieConsent);
    </script>

</body>
</html>
