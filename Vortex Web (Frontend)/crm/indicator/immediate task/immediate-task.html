<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Индикатор: Ближайшая задача</title>
    <link rel="stylesheet" href="immediate-task.css">
    <style>
        body {
            background: #0a0e17;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .demo-block {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .demo-title {
            font-size: 14px;
            color: #6c7a8d;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .demo-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .demo-note {
            font-size: 11px;
            color: #6c7a8d;
            text-align: center;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="demo-block">
        <span class="demo-title">📌 БЛИЖАЙШАЯ ЗАДАЧА</span>
        <div class="demo-row">
            <div class="crm-indicator immediate-task-button animated vortex-style"
                 data-action="immediate-task"
                 data-href="/tasks"
                 title="Ближайшая задача">
                <div class="indicator-content">
                    <span class="task-icon">📌</span>
                    <span class="task-text">ЗАГРУЗКА...</span>
                    <span class="task-status"></span>
                </div>
            </div>
        </div>
        <div class="demo-note">
            Показывает ближайшую активную задачу<br>
            📌 - нормальная | ⏰ - скоро | ⚠️ - просрочена
        </div>
    </div>

    <script src="/static/js/config.js"></script>
    <script src="immediate-task.js"></script>
</body>
</html>
