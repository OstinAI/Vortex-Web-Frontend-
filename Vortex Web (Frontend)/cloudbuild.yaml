steps:
  # Собираем образ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vortex-frontend', '.']

  # Пушим его в реестр
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vortex-frontend']

  # Деплоим в Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vortex-frontend' # Имя сервиса в Cloud Run
      - '--image'
      - 'gcr.io/$PROJECT_ID/vortex-frontend'
      - '--region'
      - 'us-central1' # Замените на ваш регион, например europe-west1

options:
  logging: CLOUD_LOGGING_ONLY
